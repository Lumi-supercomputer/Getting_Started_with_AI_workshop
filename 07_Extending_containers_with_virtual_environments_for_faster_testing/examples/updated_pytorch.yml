name: minimal_pytorch
channels:
  - conda-forge
dependencies:
  - filelock=3.29.0
  - fsspec=2026.4.0
  - jinja2=3.1.6
  - markupsafe=3.0.3
  - mpmath=1.3.0
  - networkx=3.6.1
  - numpy=2.4.6
  - pillow=12.2.0
  - pip=24.0
  - python=3.12.3
  - sympy=1.14.0
  - typing-extensions=4.15.0
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/rocm7.0/
    - triton-rocm==3.6.0
    - torch==2.10.0+rocm7.0
    - torchaudio==2.10.0+rocm7.0
    - torchvision==0.25.0+rocm7.0
    - torchmetrics==1.9.0

